registry:
  observers:
    hep.branches:
      spec: fasthep_curator.observers.branches:BRANCHES_OBSERVER_SPEC
      impl: fasthep_curator.observers.branches:run_branches_observer

    hep.schema_snapshot:
      spec: fasthep_curator.observers.schema_snapshot:SCHEMA_SNAPSHOT_OBSERVER_SPEC
      impl: fasthep_curator.observers.schema_snapshot:run_schema_snapshot_observer

  hooks:
    hep.dataset_context:
      spec: fasthep_curator.hooks.dataset_context:DATASET_CONTEXT_HOOK_SPEC
      impl: fasthep_curator.hooks.dataset_context:DatasetContextHook

    hep.error_report:
      spec: fasthep_curator.hooks.error_report:ERROR_REPORT_HOOK_SPEC
      impl: fasthep_curator.hooks.error_report:ErrorReportHook

    hep.warning_capture:
      spec: fasthep_curator.hooks.warning_capture:WARNING_CAPTURE_HOOK_SPEC
      impl: fasthep_curator.hooks.warning_capture:WarningCaptureHook

  compile_hooks:
    dataset_metadata.root_tree:
      spec: fasthep_curator.compile_hooks.root_tree_metadata:ROOT_TREE_DATASET_METADATA_SPEC
      impl: fasthep_curator.compile_hooks.root_tree_metadata:inspect_root_tree_datasets

  transforms:
    curator.root_tree_schema:
      spec: fasthep_curator.operations.schema_validation:ROOT_TREE_SCHEMA_SPEC
      impl: fasthep_curator.operations.schema_validation:run_root_tree_schema

    curator.compare_schemas:
      spec: fasthep_curator.operations.schema_validation:COMPARE_SCHEMAS_SPEC
      impl: fasthep_curator.operations.schema_validation:run_compare_schemas

  product_handlers:
    schema_snapshot:
      merge: fasthep_curator.products:merge_schema_products
      materialize: fasthep_curator.products:materialize_schema_product

    schema_comparison:
      merge: fasthep_curator.products:merge_schema_comparison_products
      materialize: fasthep_curator.products:materialize_schema_comparison_product
